#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 5
    gaps_out = 15
    border_size = 2
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
    # Defined in colors.conf (fallback) and ~/.cache/wal/colors-hypr.conf (pywal).
    col.active_border = $color1
    col.inactive_border = $inactive_border
}

decoration {
    rounding = 0
    active_opacity = 1
    inactive_opacity = 1
    shadow {
        enabled = false
        range = 25
        render_power = 1000
        # color = rgb(689d6a)
        # color = rgb(ebdbb2)
    }
    blur {
        enabled = true
        size = 1
        passes = 5

        vibrancy = 0.1696
    }
}
animations {
    enabled = yes, please :)
        bezier = wind, 0.05, 0.9, 0.1, 1.05
        bezier = winIn, 0.1, 1.1, 0.1, 1.1
        bezier = winOut, 0.3, -0.3, 0, 1
        bezier = liner, 1, 1, 1, 1
        bezier = overshot, 0.05, 0.9, 0.1, 1.05
        bezier = smoothOut, 0.5, 0, 0.99, 0.99
        bezier = smoothIn, 0.5, -0.5, 0.68, 1.5
        bezier = easeOutQuint,0.23,1,0.32,1
        bezier = easeInOutCubic,0.65,0.05,0.36,1 
        bezier = linear,0,0,1,1
        bezier = almostLinear,0.5,0.5,0.75,1.0
        bezier = quick,0.15,0,0.1,1
        animation = windows, 1, 6, wind, slide
        animation = windowsIn, 1, 5, winIn, slide
        animation = windowsOut, 1, 3, smoothOut, slide
        animation = windowsMove, 1, 5, wind, slide
        animation = border, 1, 1, liner
        animation = borderangle, 1, 180, liner, loop 
        animation = fade, 1, 3, smoothOut
        animation = workspaces, 1, 5, overshot
        animation = workspacesIn, 1, 5, winIn, slide
        animation = workspacesOut, 1, 5, winOut, slide
        animation = layers, 1, 3.81, easeOutQuint 
        animation = layersIn, 1, 4, easeOutQuint, popin 50%
        animation = layersOut, 1, 3, easeOutQuint, slide
}

dwindle {
    preserve_split = true
    force_split = 2
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false
}

#############
### INPUT ###
#############

input {
    kb_layout = us,br
    kb_variant =
    kb_model =
    kb_options = grp:ctrl_space_toggle
    kb_rules =
    accel_profile = flat
    follow_mouse = 1
    sensitivity = 0.8 
    touchpad {
        natural_scroll = false
    }
}

# gestures {
#     workspace_swipe = false
# }

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


##############################
### WINDOWS AND WORKSPACES ###
##############################

# Zathura Rules
windowrule = match:class ^(zathura)$, float on
windowrule = match:class ^(zathura)$, size 1000 1200
windowrule = match:class ^(zathura)$, center on
windowrule = match:class ^(zathura)$, workspace 3
windowrule = match:class ^(zathura)$, opacity 0.95 0.90

# Todo Scratchpad
windowrule = match:class ^(todo_scratchpad)$, float on
windowrule = match:class ^(todo_scratchpad)$, center on
windowrule = match:class ^(todo_scratchpad)$, size 650 80%
