#############################
### ENVIRONMENT VARIABLES ###
#############################

# Toolkit & Wayland Fixes
env = XDG_SESSION_TYPE,wayland
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
# env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_QPA_PLATFORMTHEME,kde

# NVIDIA Specifics (Crucial for your GTX 1650)
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = NVD_BACKEND,direct

# Flicker Fix for Electron (Obsidian, Discord, VS Code)
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# Cursor (Hyprcursor is the modern standard)
env = HYPRCURSOR_THEME,Nordzy-catppuccin-mocha-lavender
env = HYPRCURSOR_SIZE,18

exec-once = hyprctl setcursor Nordzy-catppuccin-mocha-lavender 18 

exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'Nordzy-catppuccin-mocha-lavender'
exec-once = gsettings set org.gnome.desktop.interface cursor-size 18

exec-once = easyeffects --gapplication-service

env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
# cursor {
#     no_hardware_cursors = true
#     enable_hyprcursor = true
#     warp_on_change_workspace = true
# }
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

##############
### COLORS ###
##############
# colors.conf is a static fallback palette; colors-hypr.conf is generated by pywal
# from ~/.config/wal/templates/colors-hypr.conf on every wallpaper change and
# redefines the same variables. Order matters: the later definition wins.
# On a fresh machine the second source is missing until wallpapers.sh has run
# once; Hyprland warns and continues with the fallback.
source = ~/.config/hypr/colors.conf
source = ~/.cache/wal/colors-hypr.conf

################
### MONITORS ###
################
monitor = eDP-1, 1920x1080@144, 0x0, 1
monitor = DP-2, disabled

workspace = 1,monitor:eDP-1
workspace = 2,monitor:eDP-1
workspace = 3,monitor:eDP-1
workspace = 4,monitor:eDP-1
workspace = 5,monitor:eDP-1
workspace = 6,monitor:eDP-1
workspace = 7,monitor:eDP-1
workspace = 8,monitor:DP-1
workspace = 9,monitor:DP-1
workspace = 10,monitor:DP-1


###################
### MY PROGRAMS ###
###################
#$themes = bash ~/Documents/themes/theme-switcher.sh
$terminal = kitty
$fileManager = thunar
# $menu = rofi -show drun
$menu = rofi -show drun -theme ~/.config/rofi/menu.rasi
$powermenu = zsh ~/.config/rofi/powermenu.sh
$screenshot = hyprshot -m output -m active --clipboard-only
$screenshot1 = hyprshot -m region --clipboard-only --freeze
$hyprlock = hyprlock
$killpanel = killall waybar
$startpanel = waybar
$notes = flatpak run md.obsidian.Obsidian

#################
### AUTOSTART ###
#################
# Wallpaper + theme. wallpapers.sh waits for swww-daemon (and starts it if the
# line below has not yet), restores the last wallpaper, runs wal, then
# pywal-reload.sh (hyprctl reload, waybar SIGUSR2, ...).
exec-once = swww-daemon
exec-once = ~/.config/hypr/scripts/wallpapers.sh startup

# Waybar is started here on its own rather than only as a side effect of
# pywal-reload.sh, so a wallpaper failure no longer takes the bar down with it.
# Its CSS is re-read on SIGUSR2 once the palette exists.
exec-once = waybar

# Layer rules to stop animations from being captured
layerrule = match:namespace selection, animation off
layerrule = match:namespace slurp, animation off

