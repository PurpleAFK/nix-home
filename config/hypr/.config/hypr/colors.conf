# Fallback palette. Sourced by hyprland.conf *before* ~/.cache/wal/colors-hypr.conf,
# so every variable below is redefined by pywal as soon as it has run once.
# Its only job is to let the config parse on a fresh machine (or after `wal -c`)
# before the first wallpapers.sh run. Same variable set as the wal template.

$wallpaper  = ~/.config/hypr/wallpaper.jpg

$background = rgb(0e1122)
$foreground = rgb(c2c3c7)
$cursor     = rgb(c2c3c7)

$color0  = rgb(0e1122)
$color1  = rgb(71758a)
$color2  = rgb(7d8198)
$color3  = rgb(9892ad)
$color4  = rgb(c0a4c3)
$color5  = rgb(d0afca)
$color6  = rgb(e1b7c6)
$color7  = rgb(c2c3c7)
$color8  = rgb(5e6172)
$color9  = rgb(71758a)
$color10 = rgb(7d8198)
$color11 = rgb(9892ad)
$color12 = rgb(c0a4c3)
$color13 = rgb(d0afca)
$color14 = rgb(e1b7c6)
$color15 = rgb(c2c3c7)

$active_border   = rgb(71758a)
$inactive_border = rgba(0e1122aa)
