source = ~/.cache/wal/hyprlock-colors.conf
$font = JetBrainsMono Nerd Font

# --- General Settings ---
general {
    disable_loading_bar = true
    hide_cursor = true
}

# --- Background ---
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    color = $wal_background
}

# --- Clock Label ---
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $wal_foreground
    font_size = 90
    font_family = $font
    position = 0, 40
    halign = center
    valign = center
}

# --- Date Label ---
label {
    monitor =
    text = cmd[update:3600000] date +"%A, %B %d, %Y"
    color = $wal_accent
    font_size = 25
    font_family = $font
    position = 0, -40
    halign = center
    valign = center
}

# --- Input Field ---
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $wal_border
    inner_color = $wal_background
    font_color = $wal_foreground
    fade_on_empty = false
    placeholder_text = Guess me ;)
    hide_input = false
    check_color = rgba(a6e3a1ff)   # keeping green for success
    fail_color = rgba(f38ba8ff)    # keeping red for failure
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgba(f9e2afff) # keeping yellow for capslock
    position = 0, -120
    halign = center
    valign = center
}
