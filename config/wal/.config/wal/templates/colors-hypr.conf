# Hyprland palette, generated by pywal from ~/.config/wal/templates/colors-hypr.conf
# Output: ~/.cache/wal/colors-hypr.conf  (sourced by hyprland.conf; do not edit the output)
#
# Only variable definitions live here. Hyprland's config picks roles from them.

$wallpaper  = {wallpaper}

$background = rgb({background.strip})
$foreground = rgb({foreground.strip})
$cursor     = rgb({cursor.strip})

$color0  = rgb({color0.strip})
$color1  = rgb({color1.strip})
$color2  = rgb({color2.strip})
$color3  = rgb({color3.strip})
$color4  = rgb({color4.strip})
$color5  = rgb({color5.strip})
$color6  = rgb({color6.strip})
$color7  = rgb({color7.strip})
$color8  = rgb({color8.strip})
$color9  = rgb({color9.strip})
$color10 = rgb({color10.strip})
$color11 = rgb({color11.strip})
$color12 = rgb({color12.strip})
$color13 = rgb({color13.strip})
$color14 = rgb({color14.strip})
$color15 = rgb({color15.strip})

# Role variables consumed by the general block in hyprland.conf.
# Hyprland cannot add alpha to an existing variable, so alpha is baked in here.
# No literal braces anywhere in this file: upstream pywal renders templates with
# Python str.format, where a bare brace pair is a syntax error.
$active_border   = rgb({color1.strip})
$inactive_border = rgba({background.strip}aa)
