# Setting new leader key
set -g prefix C-j

set -g mouse on

# Keybindings
bind x kill-pane
bind v split-window -v
bind b split-window -h

# Plugins are installed by nix (modules/tmux.nix) and loaded at the bottom.
# Their options must be set before that.
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'

# set -g @plugin 'rose-pine/tmux'
# set -g @rose_pine_variant 'main' #  'main', 'moon', 'dawn'
# set -g @plugin 'egel/tmux-gruvbox'
# set -g @tmux-gruvbox 'dark'
# set -g @tmux-gruvbox-right-status-z '#h #{tmux_mode_indicator}'
# set -g @plugin 'wfxr/tmux-power'
# tmux-kanagawa, renamed to ukiyo (tmuxPlugins.ukiyo)
set -g @ukiyo-theme 'kanagawa/wave'
set -g @ukiyo-ignore-window-colors true
set -g @ukiyo-plugins "git battery time"

set-option -g status-position top
set -g base-index 1
set -g renumber-windows on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

source-file ~/.config/tmux/plugins.conf
